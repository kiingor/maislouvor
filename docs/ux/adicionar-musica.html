<!doctype html>
<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>+Louvor · Protótipo de adicionar música</title>
  <style>
    :root { color-scheme:light; --bg:#e9e9ed; --surface:#f7f7fa; --ink:#27272d; --muted:#666671; --line:#d7d7de; --pill:#e7e7ec; --selected:#fff; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; -webkit-font-smoothing:antialiased; }
    :root[data-theme=dark] { color-scheme:dark; --bg:#151519; --surface:#202025; --ink:#eeeeF4; --muted:#aaaab7; --line:#3b3b45; --pill:#313139; --selected:#50505b; }
    * { box-sizing:border-box; } body { margin:0; background:var(--bg); color:var(--ink); } button { font:inherit; color:inherit; border:0; cursor:pointer; touch-action:manipulation; } button:focus-visible,a:focus-visible { outline:3px solid #5988bb; outline-offset:3px; } [hidden] { display:none!important; }
    .review-header { min-height:100px; padding:20px 32px; display:flex; align-items:center; justify-content:space-between; gap:22px; border-bottom:1px solid var(--line); background:var(--surface); } .intro { min-width:180px; } .eyebrow { font-size:10px; text-transform:uppercase; letter-spacing:1.7px; color:var(--muted); font-weight:600; margin-bottom:7px; } h1 { font-size:21px; line-height:1.2; letter-spacing:-.6px; margin:0; font-weight:650; } .review-controls { display:flex; gap:13px; align-items:center; flex-wrap:wrap; justify-content:flex-end; } .segmented { padding:4px; background:var(--pill); border-radius:13px; display:flex; gap:2px; } .segmented button { min-height:38px; padding:8px 15px; border-radius:9px; background:transparent; font-size:12px; font-weight:500; white-space:nowrap; } .segmented button[aria-pressed=true] { background:var(--selected); box-shadow:0 1px 4px #0000000e; color:var(--ink); } .theme-button { width:44px; height:44px; border:1px solid var(--line); border-radius:13px; display:grid; place-items:center; background:var(--surface); } .theme-button svg { width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:1.6; stroke-linecap:round; } .sample-button { min-height:44px; border-radius:12px; padding:8px 14px; border:1px solid var(--line); background:var(--surface); font-size:12px; }
    .review-main { padding:25px 30px 18px; } .preview-meta { max-width:1440px; margin:0 auto 13px; display:flex; gap:14px; align-items:center; justify-content:space-between; font-size:11px; color:var(--muted); line-height:1.5; } .preview-meta strong { color:var(--ink); font-weight:500; } .device-label { display:flex; align-items:center; gap:7px; white-space:nowrap; } .dot { width:5px; height:5px; background:var(--ink); border-radius:50%; display:inline-block; }
    .preview { display:flex; justify-content:center; min-height:670px; } .frame { width:100%; max-width:1440px; height:max(720px,calc(100dvh - 191px)); max-height:1000px; border:1px solid var(--line); border-radius:23px; overflow:hidden; box-shadow:0 18px 70px #24242d12; background:var(--surface); transition:width .22s ease; } .frame[data-device=mobile] { width:390px; height:844px; max-height:none; border-radius:34px; border-width:7px; border-color:#38383f; box-shadow:0 20px 65px #0002; }
    iframe { border:0; width:100%; height:100%; display:block; background:var(--surface); } .review-footer { max-width:1440px; margin:17px auto 0; display:flex; align-items:center; justify-content:space-between; gap:14px; font-size:11px; color:var(--muted); line-height:1.55; } .review-footer a { color:var(--ink); text-decoration:underline; text-underline-offset:3px; white-space:nowrap; } .demo-note { display:flex; gap:7px; align-items:flex-start; } .demo-note svg { width:14px; height:14px; flex:none; margin-top:1px; fill:none; stroke:currentColor; stroke-width:1.5; }
    @media(max-width:1050px) { .review-header { align-items:flex-start; padding:19px 24px; } .review-controls { gap:8px; } .segmented button { padding-inline:11px; } .review-main { padding-inline:22px; } }
    @media(max-width:720px) { .review-header { flex-direction:column; gap:15px; padding:20px 18px 17px; } .intro { display:flex; gap:10px; align-items:baseline; } .eyebrow { font-size:9px; letter-spacing:1px; margin:0; } h1 { font-size:19px; } .review-controls { justify-content:flex-start; width:100%; gap:7px; } .segmented button { min-height:44px; padding:8px 12px; } #device-controls { display:none; } .theme-button { margin-left:auto; } .sample-button { flex:1; } .review-main { padding:15px 0 15px; } .preview-meta { margin-inline:18px; margin-bottom:11px; font-size:10px; } .preview-meta>span:first-child { max-width:235px; } .frame,.frame[data-device=mobile] { width:100%; height:calc(100dvh - 223px); min-height:620px; max-height:none; border-radius:0; border-width:1px 0; box-shadow:none; } .preview { min-height:620px; } .review-footer { margin:15px 18px 0; align-items:flex-start; flex-direction:column; gap:8px; } }
    @media(prefers-reduced-motion:reduce) { * { transition:none!important; } }
    .preview { min-height:560px; }
    .frame { height:clamp(560px,calc(100dvh - 225px),880px); max-height:880px; }
    .frame[data-device=mobile] { height:844px; max-height:none; }
    @media(max-width:720px) {
      .preview { min-height:520px; }
      .frame,.frame[data-device=mobile] { height:calc(100dvh - 275px); min-height:520px; max-height:none; }
    }
    .simulation-controls { position:relative; flex:none; }
    .simulation-controls .sample-button { display:flex; align-items:center; justify-content:center; gap:8px; list-style:none; cursor:pointer; }
    .simulation-controls summary::-webkit-details-marker { display:none; }
    .simulation-controls summary:focus-visible { outline:3px solid #5988bb; outline-offset:3px; }
    .simulation-controls summary svg { width:14px; height:14px; fill:none; stroke:currentColor; stroke-width:1.8; }
    .simulation-menu { position:absolute; top:calc(100% + 8px); right:0; z-index:10; width:275px; max-width:calc(100vw - 36px); padding:6px; border:1px solid var(--line); border-radius:15px; background:var(--surface); box-shadow:0 12px 38px #0002; }
    .simulation-menu button { display:block; min-height:60px; width:100%; padding:11px 12px; border-radius:10px; background:transparent; text-align:left; }
    .simulation-menu button:hover { background:var(--pill); }
    .simulation-menu strong { display:block; font-size:12px; font-weight:600; }
    .simulation-menu span { display:block; margin-top:5px; font-size:11px; line-height:1.45; color:var(--muted); }
    @media(max-width:720px) { .simulation-controls { flex:1; } .simulation-controls .sample-button { width:100%; } }
  </style>
</head>
<body>
  <header class="review-header"><div class="intro"><div class="eyebrow">+Louvor · Estudo de experiência</div><h1>Adicionar música</h1></div><div class="review-controls"><div class="segmented" role="group" aria-label="Explorar telas do protótipo"><button type="button" data-view="choose" aria-pressed="true">Popup</button><button type="button" data-view="search" aria-pressed="false">Buscar músicas</button><button type="button" data-view="editor" aria-pressed="false">Cadastro</button></div><details class="simulation-controls" id="simulation-controls"><summary class="sample-button" id="sample">Simular preenchimento<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></summary><div class="simulation-menu"><button type="button" data-simulation="info" aria-label="Preencher informações"><strong>Preencher informações</strong><span>Dados, tags, cifra e link. Teste a importação.</span></button><button type="button" data-simulation="ready" aria-label="Deixar música pronta"><strong>Deixar música pronta</strong><span>Inclui áudio e faixas. Teste a revisão.</span></button><button type="button" data-simulation="reset" aria-label="Limpar cadastro"><strong>Limpar cadastro</strong><span>Comece de novo para testar os campos.</span></button></div></details><div class="segmented" role="group" aria-label="Tamanho da prévia" id="device-controls"><button type="button" data-device="desktop" aria-pressed="true">Desktop</button><button type="button" data-device="mobile" aria-pressed="false">Celular</button></div><button type="button" class="theme-button" id="theme" aria-label="Ver tema escuro" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4 8.5 8.5 0 1 0 20 14.5z"/></svg></button></div></header>
  <main class="review-main"><div class="preview-meta"><span id="flow-note"><strong>Uma escolha simples.</strong> Use uma música pronta ou cadastre a sua.</span><span class="device-label"><span class="dot"></span><span id="device-label">Prévia interativa</span></span></div><div class="preview"><div class="frame" id="frame" data-device="desktop"><iframe id="prototype" src="adicionar-musica-app.html" title="Protótipo interativo do cadastro e busca de músicas do MaisLouvor"></iframe></div></div><footer class="review-footer"><span class="demo-note"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7h.01M12 11v6"/></svg>Dados ilustrativos. Ações e arquivos ficam apenas nesta prévia, até recarregar a página.</span><a href="adicionar-musica-app.html" target="_blank" rel="noopener">Abrir somente o protótipo ↗</a></footer></main>
  <script>
    const preview = document.getElementById('prototype');
    let theme='light', view='choose';
    const send=(message)=>preview.contentWindow.postMessage({type:'maislouvor-preview',...message},'*');
    const descriptions={choose:'<strong>Uma escolha simples.</strong> Use uma música pronta ou cadastre a sua.',search:'<strong>Encontre a versão certa.</strong> Filtros, páginas e seleção de várias músicas.',editor:'<strong>Cadastro revisado.</strong> Informações → preparar música → revisar. Importação, separação e detecção simuladas nesta prévia.',drafts:'<strong>Continue depois.</strong> Rascunhos ficam fora da busca de músicas.'};
    function sync(){for(const button of document.querySelectorAll('[data-view]'))button.setAttribute('aria-pressed',String(button.dataset.view===view));document.getElementById('flow-note').innerHTML=descriptions[view]||descriptions.choose;}
    document.querySelectorAll('[data-view]').forEach(button=>button.addEventListener('click',()=>{view=button.dataset.view;sync();send({view});}));
    document.querySelectorAll('[data-device]').forEach(button=>button.addEventListener('click',()=>{const device=button.dataset.device;document.getElementById('frame').dataset.device=device;for(const b of document.querySelectorAll('button[data-device]'))b.setAttribute('aria-pressed',String(b===button));document.getElementById('device-label').textContent=device==='mobile'?'Celular · 390 px':'Prévia interativa';}));
    document.getElementById('theme').addEventListener('click',()=>{theme=theme==='light'?'dark':'light';document.documentElement.dataset.theme=theme;document.getElementById('theme').setAttribute('aria-pressed',String(theme==='dark'));document.getElementById('theme').setAttribute('aria-label',theme==='dark'?'Ver tema claro':'Ver tema escuro');send({theme});});
    document.getElementById('simulation-controls').addEventListener('click',event=>{const button=event.target.closest('[data-simulation]');if(!button)return;send({action:button.dataset.simulation});document.getElementById('simulation-controls').open=false;});
    document.addEventListener('pointerdown',event=>{if(!event.target.closest('#simulation-controls'))document.getElementById('simulation-controls').open=false;});
    document.getElementById('simulation-controls').addEventListener('keydown',event=>{if(event.key==='Escape'){event.preventDefault();document.getElementById('simulation-controls').open=false;document.getElementById('sample').focus();}});
    window.addEventListener('message',event=>{if(event.source!==preview.contentWindow||event.data?.type!=='maislouvor-preview-state')return;view=event.data.view;sync();});
    preview.addEventListener('load',()=>send({theme}));
  </script>
</body>
</html>
