project_id = "hhqzapwtuyzchismcuie"

[functions.import-song-audio]
verify_jwt = true

# Exclusão da própria conta: só com sessão. A function ainda confere o usuário
# pelo token (nunca por um id no corpo) e exige a confirmação digitada.
[functions.delete-account]
verify_jwt = true

# verify_jwt = false deixa a function acessível sem nenhuma credencial.
#
# Em 16/08/2026 havia 11 funções assim, três delas chamando o gateway de IA pago
# com a LOVABLE_API_KEY do dono e sem verificar quem chamava. Abaixo ficam apenas
# as que precisam mesmo ser públicas; as demais passam a exigir JWT (o
# supabase.functions.invoke() do front já envia o token do usuário logado).
#
# AVISO: aplicar isto exige redeploy das functions. Antes de subir, confirme que
# stems-callback continua funcionando — quem chama é o container demucs-worker da
# VPS, que está fora deste repositório.

# Link de convite: pode ser aberto por quem ainda não tem sessão.
[functions.accept-invite]
verify_jwt = false

# Playlist compartilhada por link público — chamada por fetch direto, sem token
# (src/pages/PublicPlaylist.tsx:117).
[functions.public-playlist]
verify_jwt = false

# Retorno do worker de stems da VPS. Chamador externo a este repositório.
[functions.stems-callback]
verify_jwt = false

# Webhook da Evolution API (assistente no WhatsApp). A Evolution não manda JWT;
# a função exige o segredo WHATSAPP_WEBHOOK_SECRET no caminho da URL.
[functions.whatsapp-assistant]
verify_jwt = false

# As funções abaixo passaram a exigir JWT em 16/08/2026:
#
#   suggest-culto-songs, import-moises, import-cifra, create-invite,
#   separate-stems  -> chamadas pelo front em contexto autenticado
#   sync-lyrics, transcribe-sync, transpose -> sem nenhum chamador no código;
#                                              estavam abertas à toa
#
# Se alguma delas quebrar depois do deploy, o chamador não estava enviando
# sessão — corrija o chamador, não reabra a function.
